<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#000000" />
    <meta name="geo.region" content="US-DE" />
    <meta name="geo.placename" content="Milford" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Eagle Lux Multi Services" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/.netlify/images?url=/img/hero.png&w=1600&fm=webp&q=78" imagesrcset="/.netlify/images?url=/img/hero.png&w=800&fm=webp&q=78 800w, /.netlify/images?url=/img/hero.png&w=1200&fm=webp&q=78 1200w, /.netlify/images?url=/img/hero.png&w=1600&fm=webp&q=78 1600w, /.netlify/images?url=/img/hero.png&w=2000&fm=webp&q=78 2000w" imagesizes="100vw" fetchpriority="high" />
    <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>

    <!-- Structured data (generated at build time from src/content.js) -->
    <!--json-ld-->
  </head>
  <body>
    <!-- Static form definition so Netlify Forms detects the React-rendered contact form at deploy time -->
    <form name="appointment" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="appointment" />
      <input type="text" name="fullName" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <select name="service"><option value="">-</option></select>
      <input type="date" name="preferredDate" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
      <input type="hidden" name="subject" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
